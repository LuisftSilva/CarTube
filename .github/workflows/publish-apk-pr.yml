name: Publish APK to PR

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.pull_request.title, '[publish-apk]') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK in branch
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/CarTube-Debug-v3.2-safe.apk
          sha256sum apk/CarTube-Debug-v3.2-safe.apk > apk/CarTube-Debug-v3.2-safe.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/CarTube-Debug-v3.2-safe.apk apk/CarTube-Debug-v3.2-safe.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is already current"
            exit 0
          fi
          git commit -m "build: publish CarTube debug APK"
          git push origin HEAD:${{ github.head_ref }}
