name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk CarTube-Debug-v3.2-safe.apk

      - name: Generate checksum
        run: sha256sum CarTube-Debug-v3.2-safe.apk | tee CarTube-Debug-v3.2-safe.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarTube-Debug-v3.2-safe
          path: |
            CarTube-Debug-v3.2-safe.apk
            CarTube-Debug-v3.2-safe.apk.sha256
          if-no-files-found: error
          retention-days: 90
