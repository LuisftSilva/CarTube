plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pi.cartubesafe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pi.cartubesafe'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '3.3.0'
    }

    buildTypes {
        debug {
            // Development build type. No user-visible .debug package/version suffix.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.media:media:1.8.0"
}
